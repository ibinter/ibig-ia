{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h2>Connexion au tableau de bord</h2>
  <form method="post" action="/login">
    <p><label>Adresse mail<br><input type="text" name="email" autocomplete="username" required></label></p>
    <p><label>Mot de passe<br><input type="password" name="password" autocomplete="current-password" required></label></p>
    <button class="ok">Entrer</button>
  </form>
</div>
{% endblock %}
