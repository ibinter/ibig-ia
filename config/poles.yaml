# Les 8 pôles d'IBIG SARL (section 2 du cahier des charges).
# `code` est l'identifiant utilisé partout (classement, comptes, fiches).
# `valideur` / `suppleant` : ADRESSES MAIL, à compléter par IBIG avant la phase 1
# (section 19). Elles donnent les droits de validation du pôle dans le tableau de bord
# (compte créé avec `ibig-agent utilisateur ajouter`) et reçoivent les alertes.
# `commercial` : adresse du commercial du pôle, qui reçoit les alertes prospects
# (à défaut, le valideur). `support` : adresse qui reçoit les tickets du support
# (à défaut, le valideur).
poles:
