name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ibig
          POSTGRES_PASSWORD: ibig
          POSTGRES_DB: ibig_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibig -d ibig_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IBIG_TEST_POSTGRES_URL: postgresql+psycopg://ibig:ibig@localhost:5432/ibig_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check src tests
      - run: pytest -q
