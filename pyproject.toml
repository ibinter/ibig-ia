[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibig-agent"
version = "0.1.0"
description = "Agent IA de communication et d'opérations de l'écosystème IBIG SARL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
gmail = ["google-api-python-client>=2.130", "google-auth>=2.30"]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.16.9"]

[project.scripts]
ibig-agent = "ibig_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibig_agent = ["dashboard/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Dépendances FastAPI déclarées en valeur par défaut (idiome du framework).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]
